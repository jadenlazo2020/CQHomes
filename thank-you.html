<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Chris Quirarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a; --blueprint-deep:#000000; --paper:#ffffff; --paper-dim:#dcdcdc;
    --display:'Fraunces',serif; --mono:'IBM Plex Mono',monospace; --body:'Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--blueprint-deep); color:#fff; font-family:var(--body);
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:32px;
  }
  .box{max-width:480px;}
  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.55); margin-bottom:18px;}
  h1{font-family:var(--display); font-weight:500; font-size:clamp(32px,5vw,48px); line-height:1.15; margin-bottom:18px;}
  p{color:rgba(255,255,255,0.75); font-size:16px; line-height:1.6; margin-bottom:34px;}
  .btn{
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    padding:15px 26px; border-radius:2px; display:inline-flex; align-items:center; gap:8px;
    border:1px solid rgba(255,255,255,0.35); color:#fff; transition:border-color .2s, color .2s;
  }
  .btn:hover{border-color:#fff;}
</style>
</head>
<body>
  <div class="box">
    <p class="eyebrow">Message Sent</p>
    <h1>Thanks — Chris will be in touch shortly.</h1>
    <p>Your message has been received. For anything urgent, feel free to call or text (209) 777-9777 directly.</p>
    <a href="index.html" class="btn">Back to the site</a>
  </div>
</body>
</html>
